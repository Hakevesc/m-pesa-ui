<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=360, initial-scale=1.0">
    <title>Account Linked Successfully</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 360px;
            height: 760px;
            background-color: #ffffff;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .mobile-container::-webkit-scrollbar {
            display: none;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 24px;
            justify-content: center;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #2FC56D;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-icon svg {
            animation: checkmark 0.4s ease-out 0.3s both;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes checkmark {
            0% { stroke-dashoffset: 100; }
            100% { stroke-dashoffset: 0; }
        }

        .done-btn {
            width: 100%;
            background-color: #2FC56D;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 30px;
            font-family: 'Barlow', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 16px rgba(47, 197, 109, 0.3);
            transition: all 0.2s;
            animation: slideUp 0.5s ease-out 0.4s both;
        }

        .done-btn:hover {
            background-color: #28b362;
        }

        .done-btn:active {
            transform: scale(0.98);
        }

        @keyframes slideUp {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .success-message {
            animation: fadeIn 0.5s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Status Bar -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 20px 4px 20px; font-size: 13px; font-weight: 600; color: #333333;">
            <span>4:11</span>
            <div style="display: flex; align-items: center; gap: 8px;">
                <i data-lucide="signal" style="width: 16px; height: 14px; color: #333333;"></i>
                <span style="font-size: 11px; font-weight: 600; color: #333333;">LTE</span>
                <span style="font-size: 11px; font-weight: 600; color: #666666;">24</span>
                <i data-lucide="battery" style="width: 20px; height: 14px; color: #666666;"></i>
            </div>
        </div>

        <!-- Header -->
        <header style="display: flex; justify-content: flex-end; align-items: center; padding: 12px 20px; gap: 12px;">
            <button style="background: none; border: none; cursor: pointer; padding: 4px;">
                <i data-lucide="more-horizontal" style="width: 22px; height: 22px; color: #666666;"></i>
            </button>
            <button style="background: none; border: none; cursor: pointer; padding: 4px;" onclick="closeScreen()">
                <i data-lucide="x" style="width: 22px; height: 22px; color: #666666;"></i>
            </button>
        </header>

        <div class="content-area">
            <!-- M-PESA Logo -->
            <div style="margin-bottom: 80px;">
                <img src="M-PESA_logo.svg" alt="M-PESA" style="height: 44px; width: auto;">
            </div>

            <!-- Success Icon -->
            <div class="success-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2FC56D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>

            <!-- Success Message -->
            <p class="success-message" style="font-size: 14px; font-weight: 500; color: #2FC56D; text-align: center; line-height: 1.6; max-width: 280px;">
                Your PayPal account has been created and successfully linked to your M-PESA account.
            </p>
        </div>

        <!-- Done Button -->
        <div style="padding: 0 20px 32px 20px;">
            <button class="done-btn" onclick="handleDone()">
                DONE
            </button>
        </div>

        <!-- Android Navigation Bar -->
        <div style="display: flex; justify-content: space-around; align-items: center; padding: 12px 0 8px 0; background: #000000;">
            <div style="width: 20px; height: 2px; background: #ffffff; border-radius: 1px;"></div>
            <div style="width: 20px; height: 20px; border: 2px solid #ffffff; border-radius: 50%;"></div>
            <i data-lucide="triangle" style="width: 20px; height: 20px; color: #ffffff; transform: rotate(-90deg);"></i>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function handleDone() {
            // Add your done logic here - navigate to dashboard or home
            console.log('Done clicked - Account successfully linked');
        }

        function closeScreen() {
            console.log('Close clicked');
        }
    </script>
</body>
</html>
